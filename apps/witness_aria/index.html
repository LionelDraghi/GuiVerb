<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>ARIA practices witness</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<h1>ARIA witness</h1>

<p>This application exercises the milestone-2 vocabulary: widget
states, structure, and focus, with markup following the WAI-ARIA
Authoring Practices patterns.</p>

<section aria-label="Notifications">
  <ul>
    <li>First notification</li>
    <li>Second notification</li>
  </ul>
</section>

<button id="details-toggle" aria-expanded="false" aria-controls="details">Details</button>
<div id="details" role="region" aria-label="Details" hidden>
  <p>Details are now visible</p>
</div>

<p>
  <input type="checkbox" id="subscribe">
  <label for="subscribe">Subscribe</label>
</p>

<script src="app.js"></script>
</body>
</html>
